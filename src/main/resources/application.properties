spring.application.name=proyect-mcp

# Base de datos H2 en memoria para desarrollo local.
# Los datos se conservan mientras la JVM esté activa y se reinician al cerrar la aplicación.
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.username=sa
spring.datasource.password=

# Crea/actualiza las tablas a partir de las entidades JPA del proyecto.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Claude Desktop connects to this server as a local STDIO subprocess.
spring.ai.mcp.server.name=tdea-banking-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.jackson.serialization.write-dates-as-timestamps=false
